<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>话咯 App · 下载</title>
  <!-- Material Symbols 图标库 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    /* 全局重置 + 移除默认边距/边框 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      border: none;
      outline: none;
    }

    /* 移除 body 和 html 的默认边框、背景、边距，实现全屏 */
    html, body {
      width: 100%;
      height: 100%;
      background-color: black;
      font-family: 'Roboto', 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      border: none;
      outline: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    /* 卡片容器 */
    .download-card {
      background-color: #ffffff;
      border-radius: 2px;
      height: 100%;
      width: 400px;
 
      padding: 24px 20px 20px 20px;
      display: flex;
      flex-direction: column;
      margin: 16px auto;
      border: none;
    }

    /* 头部：图标 + 名称 + 版本 */
    .app-header {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }

    /* 话咯 App 图标 */
    .app-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(145deg, #8b5cf6, #6d28d9);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(109, 40, 217, 0.3);
      margin-right: 16px;
      flex-shrink: 0;
      border: none;
    }

    .app-icon .material-symbols-outlined {
      color: white;
      font-size: 42px;
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 32;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 应用信息 */
    .app-info {
      flex: 1;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      color: #1e1e1e;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
      line-height: 1.2;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .version-badge {
      background-color: #ede9fe;
      color: #6d28d9;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      border: none;
    }

    .app-meta {
      font-size: 14px;
      color: #5f6368;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .app-meta span {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stars {
      display: flex;
      color: #fbbc04;
      font-size: 16px;
      letter-spacing: -1px;
    }

    .rating-text {
      font-size: 13px;
      color: #5f6368;
      margin-left: 3px;
    }

    /* 分割线 */
    .divider {
      height: 1px;
      background-color: #e8eaed;
      margin: 16px 0 18px 0;
      border: none;
    }

    /* 应用描述 */
    .app-description {
      font-size: 14px;
      line-height: 1.5;
      color: #3c4043;
      margin-bottom: 24px;
      padding: 0 2px;
    }

    /* 下载信息行 */
    .download-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8f9fa;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #3c4043;
      border: none;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-item .material-symbols-outlined {
      font-size: 18px;
      color: #6d28d9;
    }

    /* 下载按钮 */
    .download-btn {
      background-color: #6d28d9;
      color: white;
      border: none;
      border-radius: 2px;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.4);
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
      cursor: pointer;
      letter-spacing: 0.5px;
      width: 100%;
      outline: none;
    }

    .download-btn:active {
      background-color: #5b21b6;
      box-shadow: 0 2px 6px rgba(109, 40, 217, 0.5);
      transform: scale(0.98);
    }

    .download-btn .material-symbols-outlined {
      font-size: 24px;
    }

    /* 安全提示 */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: #5f6368;
    }

    .security-note .material-symbols-outlined {
      font-size: 14px;
      color: #34a853;
    }

    /* 手机小屏适配 */
    @media (max-width: 480px) {
      .download-card {
        max-width: 100%;
        border-radius: 0;
        margin: 0;
        min-height: 100vh;
        padding: 20px 16px 32px 16px;
        box-shadow: none;
        background-color: #ffffff;
        justify-content: center;
      }
      body {
        background-color: #ffffff;
      }
      .app-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      .app-icon .material-symbols-outlined {
        font-size: 34px;
      }
      .app-name {
        font-size: 20px;
      }
      .download-btn {
        padding: 16px 20px;
        font-size: 17px;
      }
      .download-info {
        padding: 10px 14px;
      }
    }

    /* 极窄屏 */
    @media (max-width: 360px) {
      .app-header {
        flex-wrap: wrap;
      }
      .app-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        margin-right: 12px;
      }
      .app-icon .material-symbols-outlined {
        font-size: 28px;
      }
      .app-name {
        font-size: 18px;
      }
      .download-btn {
        font-size: 16px;
        padding: 14px 18px;
      }
    }

    button, div, span, a {
      border: none;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- 下载卡片 -->
  <div class="download-card">
    <!-- 头部 -->
    <div class="app-header">
      <div class="app-icon">
        <img src="https://avatars.githubusercontent.com/u/107161041?s=280" width=70 height=70 />
      </div>
      <div class="app-info">
        <div class="app-name">
          nthlink
          <span class="version-badge">v3.2.1</span>
        </div>
        <div class="app-meta">
          <span class="rating">
            <span class="stars">#</span>
            <span class="rating-text">#</span>
          </span>
          <span>•</span>
          <span>#</span>
        </div>
      </div>
    </div>

    <!-- 分割线 -->
    <div class="divider"></div>

    <!-- 应用描述 -->
    <div class="app-description">
      记得改后缀
    </div>

    <!-- 下载信息 -->
    <div class="download-info">
      <div class="info-item">
        <span class="material-symbols-outlined">hard_drive</span>
        <span># MB</span>
      </div>
      <div class="info-item">
        <span class="material-symbols-outlined">new_releases</span>
        <span>最新版 v#</span>
      </div>
    </div>

    <!-- 下载按钮 -->
    <button class="download-btn" id="downloadBtn">
      <span class="material-symbols-outlined">download</span>
      立即下载
    </button>

    <!-- 安全提示 -->
    <div class="security-note">
      <span class="material-symbols-outlined">verified_user</span>
      <span>#</span>
    </div>
  </div>

  <script>
    (function() {
      // ============================================
      // 外部下载链接 (请替换为实际下载地址)
      // ============================================
      const DOWNLOAD_URL = 'https://wwaty.lanzoue.com/iBwu02zp1rgh';

      const downloadBtn = document.getElementById('downloadBtn');

      // ============================================
      // 核心：使用外部浏览器打开下载链接
      // ============================================
      function openInExternalBrowser(url) {
        // 检测是否在微信/QQ等内置浏览器中打开
        const ua = navigator.userAgent.toLowerCase();
        const isWeChat = ua.indexOf('micromessenger') !== -1;
        const isQQ = ua.indexOf('qq/') !== -1 && ua.indexOf('mqqbrowser') === -1;
        const isWeibo = ua.indexOf('weibo') !== -1;
        const isAlipay = ua.indexOf('alipayclient') !== -1;
        const isBaidu = ua.indexOf('baiduboxapp') !== -1;
        const isDingTalk = ua.indexOf('dingtalk') !== -1;

        // 如果是内置浏览器，尝试通过特殊协议唤起外部浏览器
        if (isWeChat || isQQ || isWeibo || isAlipay || isBaidu || isDingTalk) {
          // 方法1：使用 window.open 在新窗口打开 (部分内置浏览器支持)
          const newWindow = window.open(url, '_blank');
          
          // 如果新窗口被拦截，使用 iframe 或 location 兜底
          if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
            // 方法2：通过 a 标签的 target="_blank" 触发外部浏览器
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }
        } else {
          // 普通浏览器环境，直接跳转即可（通常就是外部浏览器）
          window.location.href = url;
        }
      }

      // ============================================
      // 按钮点击事件
      // ============================================
      downloadBtn.addEventListener('click', function(e) {
        e.preventDefault();

        // 添加点击反馈
        const originalText = downloadBtn.innerHTML;
        downloadBtn.innerHTML = '<span class="material-symbols-outlined">hourglass_top</span> 正在打开浏览器...';
        downloadBtn.disabled = true;
        downloadBtn.style.opacity = '0.8';

        // 短延迟后跳转 (让用户看到反馈)
        setTimeout(() => {
          openInExternalBrowser(DOWNLOAD_URL);

          // 恢复按钮状态 (以防用户返回页面)
          setTimeout(() => {
            downloadBtn.innerHTML = originalText;
            downloadBtn.disabled = false;
            downloadBtn.style.opacity = '1';
          }, 1500);
        }, 300);
      });
    })();
  </script>

  <!-- Roboto 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</body>
</html>
